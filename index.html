<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Night Invite 💌</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-110vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-rose-100 to-pink-200 min-h-screen text-slate-800 font-sans selection:bg-pink-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // React-native inline SVG icon component to avoid direct DOM manipulation errors
    const Icon = ({ name, className = "w-5 h-5", fill = "none" }) => {
      const icons = {
        heart: (
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
        ),
        sparkles: (
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        ),
        tv: (
          <>
            <rect width="20" height="15" x="2" y="7" rx="2" />
            <polyline points="17 2 12 7 7 2" />
          </>
        ),
        ghost: (
          <path d="M9 10h.01M15 10h.01M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8Z" />
        ),
        popcorn: (
          <>
            <path d="M18 8a2 2 0 0 0 0-4 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0 0 4" />
            <path d="M4 8v12a2 2 0 0 0 2 2 h12a2 2 0 0 0 2-2V8" />
          </>
        ),
        rocket: (
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09zM12 15l-3-3m0 0l2.5-7.5L18 3l1.5 6.5L12 15z" />
        ),
        film: (
          <>
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M7 3v18M17 3v18M3 7.5h4M3 12h18M3 16.5h4M17 7.5h4M17 16.5h4" />
          </>
        ),
        "check-circle-2": (
          <>
            <circle cx="12" cy="12" r="10" />
            <path d="m9 12 2 2 4-4" />
          </>
        ),
        "party-popper": (
          <path d="M5.8 11.3 2 22l10.7-3.8M4 3h.01M22 8h.01M15 2h.01M22 20h.01M18 11l-1.5-1.5M11 18l-1.5-1.5" />
        ),
        calendar: (
          <>
            <rect width="18" height="18" x="3" y="4" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </>
        ),
        clock: (
          <>
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </>
        ),
        x: <path d="M18 6 6 18M6 6l12 12" />,
      };

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill={fill}
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {icons[name] || null}
        </svg>
      );
    };

    function App() {
      const [isOpen, setIsOpen] = useState(false);
      const [selectedGenre, setSelectedGenre] = useState(null);
      const [customMovie, setCustomMovie] = useState("");
      const [showModal, setShowModal] = useState(false);
      const [hearts, setHearts] = useState([]);

      useEffect(() => {
        const generatedHearts = Array.from({ length: 25 }).map((_, i) => ({
          id: i,
          size: Math.random() * 20 + 12,
          left: Math.random() * 100,
          animationDuration: Math.random() * 6 + 4,
          delay: Math.random() * 4,
          opacity: Math.random() * 0.5 + 0.3,
        }));
        setHearts(generatedHearts);
      }, []);

      const genres = [
        { id: "romance", label: "Romance", icon: "heart", color: "from-pink-400 to-rose-400", desc: "Cozy vibes & sweet endings 💕" },
        { id: "kdrama", label: "K-Drama", icon: "tv", color: "from-fuchsia-400 to-pink-400", desc: "Bingeworthy plots & swoon moments 🌸" },
        { id: "horror", label: "Horror", icon: "ghost", color: "from-rose-500 to-purple-600", desc: "Excuse to hold hands tight 🙈" },
        { id: "action", label: "Action", icon: "popcorn", color: "from-purple-400 to-pink-500", desc: "High energy & thrilling scenes 🎬" },
        { id: "scifi", label: "Sci-Fi", icon: "rocket", color: "from-indigo-400 to-pink-400", desc: "Mind-bending futuristic worlds 🚀" },
      ];

      const handleGenreSelect = (genreId) => {
        setSelectedGenre(genreId);
        setCustomMovie("");
      };

      const handleAccept = () => {
        if (selectedGenre || customMovie.trim()) {
          setShowModal(true);
        }
      };

      const getChosenGenreLabel = () => {
        if (customMovie.trim()) return `Custom Pick: "${customMovie}"`;
        const found = genres.find((g) => g.id === selectedGenre);
        return found ? found.label : "Movie Night Pick";
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
          
          {/* Floating Hearts Background */}
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
            {hearts.map((h) => (
              <div
                key={h.id}
                className="absolute text-pink-400/50"
                style={{
                  left: `${h.left}%`,
                  bottom: `-30px`,
                  fontSize: `${h.size}px`,
                  animation: `floatUp ${h.animationDuration}s linear infinite`,
                  animationDelay: `${h.delay}s`,
                  opacity: h.opacity,
                }}
              >
                💖
              </div>
            ))}
          </div>

          {/* Main Card Container */}
          <div className="relative z-10 w-full max-w-xl">
            {!isOpen ? (
              /* Step 1: Envelope / Invitation Landing Card */
              <div className="bg-white/85 backdrop-blur-xl rounded-3xl p-8 sm:p-10 shadow-2xl border border-pink-200/80 text-center transform transition-all duration-500 hover:scale-[1.01]">
                <div className="relative inline-block mb-6">
                  <div className="w-24 h-24 sm:w-28 sm:h-28 bg-gradient-to-tr from-pink-400 via-rose-400 to-pink-300 rounded-full flex items-center justify-center mx-auto shadow-xl shadow-pink-300/60 animate-pulse">
                    <Icon name="heart" className="w-12 h-12 sm:w-14 sm:h-14 text-white" fill="white" />
                  </div>
                  <div className="absolute -top-1 -right-1 animate-spin" style={{ animationDuration: '8s' }}>
                    <Icon name="sparkles" className="w-6 h-6 text-pink-500" />
                  </div>
                </div>

                <div className="inline-flex items-center gap-1.5 px-4 py-1.5 bg-pink-100/80 text-pink-600 rounded-full text-xs font-bold tracking-wide uppercase mb-3">
                  <Icon name="sparkles" className="w-3.5 h-3.5 text-pink-500" />
                  <span>Special Delivery For You</span>
                  <Icon name="sparkles" className="w-3.5 h-3.5 text-pink-500" />
                </div>

                <h1 className="text-3xl sm:text-4xl font-extrabold text-pink-600 mb-3 tracking-tight">
                  An Invitation For <br />
                  <span className="text-rose-500 underline decoration-pink-300 underline-offset-4">My Favorite Person 💌</span>
                </h1>

                <p className="text-slate-600 mb-8 text-sm sm:text-base leading-relaxed">
                  You are cordially invited to a cozy movie night! Will you open your invite? ✨
                </p>

                <button
                  onClick={() => setIsOpen(true)}
                  className="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-pink-500 via-rose-500 to-pink-600 hover:from-pink-600 hover:to-rose-600 text-white font-bold rounded-full shadow-lg shadow-pink-500/30 hover:shadow-xl hover:shadow-pink-500/50 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center mx-auto gap-2.5 group text-base cursor-pointer"
                >
                  <Icon name="heart" className="w-5 h-5 group-hover:scale-125 transition-transform duration-200" fill="white" />
                  <span>Open Invite 💌</span>
                </button>
              </div>
            ) : (
              /* Step 2: Interactive Genre Selection Card */
              <div className="bg-white/90 backdrop-blur-xl rounded-3xl p-6 sm:p-8 shadow-2xl border border-pink-200/90 transition-all duration-300">
                {/* Header */}
                <div className="text-center mb-6">
                  <div className="inline-flex items-center gap-1.5 text-pink-600 font-medium text-xs sm:text-sm bg-pink-100/70 px-3 py-1 rounded-full mb-2">
                    <Icon name="sparkles" className="w-3.5 h-3.5 text-pink-500" /> 
                    <span>Movie Night Invitation</span> 
                    <Icon name="sparkles" className="w-3.5 h-3.5 text-pink-500" />
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-800">
                    What are we watching? 🎬
                  </h2>
                  <p className="text-slate-500 text-xs sm:text-sm mt-1">
                    Choose a movie genre below to lock in our movie night!
                  </p>
                </div>

                {/* Genre Selection Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">
                  {genres.map((genre) => {
                    const isSelected = selectedGenre === genre.id && !customMovie.trim();
                    return (
                      <button
                        key={genre.id}
                        onClick={() => handleGenreSelect(genre.id)}
                        className={`p-4 rounded-2xl text-left transition-all duration-200 border flex items-center gap-3 relative overflow-hidden group cursor-pointer ${
                          isSelected
                            ? "bg-gradient-to-r from-pink-50 to-rose-50 border-pink-400 shadow-md ring-2 ring-pink-400/50 scale-[1.01]"
                            : "bg-white/80 border-pink-100 hover:border-pink-300 hover:bg-pink-50/50"
                        }`}
                      >
                        <div
                          className={`p-2.5 rounded-xl bg-gradient-to-br ${genre.color} text-white shadow-sm group-hover:scale-110 transition-transform duration-200 shrink-0 flex items-center justify-center`}
                        >
                          <Icon name={genre.icon} className="w-5 h-5" />
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-slate-800 text-sm">{genre.label}</span>
                            {isSelected && <Icon name="check-circle-2" className="w-4 h-4 text-pink-500 shrink-0" />}
                          </div>
                          <p className="text-[11px] text-slate-500 truncate mt-0.5">{genre.desc}</p>
                        </div>
                      </button>
                    );
                  })}
                </div>

                {/* Custom Movie Input */}
                <div className="mb-6">
                  <label className="block text-xs font-semibold text-slate-700 mb-1.5 flex items-center gap-1.5">
                    <Icon name="film" className="w-3.5 h-3.5 text-pink-500" />
                    <span>Or request a specific title or show:</span>
                  </label>
                  <div className="relative">
                    <input
                      type="text"
                      placeholder="e.g. Tangled, Crash Landing on You, Shrek..."
                      value={customMovie}
                      onChange={(e) => {
                        setCustomMovie(e.target.value);
                        if (e.target.value.trim()) setSelectedGenre(null);
                      }}
                      className="w-full px-4 py-3 bg-pink-50/50 border border-pink-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 focus:bg-white text-slate-800 placeholder-slate-400 transition-all"
                    />
                    {customMovie.trim() && (
                      <span className="absolute right-3 top-1/2 -translate-y-1/2 text-pink-600 text-xs font-bold bg-pink-100 px-2.5 py-1 rounded-lg">
                        Selected ✨
                      </span>
                    )}
                  </div>
                </div>

                {/* Accept Button */}
                <button
                  disabled={!selectedGenre && !customMovie.trim()}
                  onClick={handleAccept}
                  className={`w-full py-3.5 px-6 rounded-2xl font-bold text-sm sm:text-base shadow-lg transition-all duration-200 flex items-center justify-center gap-2 ${
                    selectedGenre || customMovie.trim()
                      ? "bg-gradient-to-r from-pink-500 via-rose-500 to-purple-500 text-white shadow-pink-500/30 hover:shadow-pink-500/50 hover:scale-[1.01] active:scale-95 cursor-pointer"
                      : "bg-slate-200 text-slate-400 cursor-not-allowed shadow-none"
                  }`}
                >
                  <Icon name="heart" className="w-4 h-4" fill={selectedGenre || customMovie.trim() ? "white" : "none"} />
                  <span>Accept & Reserve Movie Night</span>
                </button>

                {/* Bottom Note */}
                <div className="mt-6 pt-4 border-t border-pink-100 text-center">
                  <p className="text-xs sm:text-sm text-pink-700 font-medium italic bg-pink-50/80 py-2.5 px-4 rounded-2xl inline-block border border-pink-200/80 shadow-xs">
                    ✨ or any movie or series that you'd like!! ✨
                  </p>
                </div>
              </div>
            )}
          </div>

          {/* Confirmation Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm transition-opacity">
              <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-pink-200 text-center relative overflow-hidden transform transition-all">
                {/* Accent Line Header */}
                <div className="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-pink-400 via-rose-500 to-purple-500"></div>

                <button
                  onClick={() => setShowModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100 transition"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="w-16 h-16 bg-gradient-to-tr from-pink-400 to-rose-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white shadow-lg shadow-pink-300/50 rotate-3">
                  <Icon name="party-popper" className="w-8 h-8" />
                </div>

                <span className="text-xs font-bold text-pink-600 uppercase tracking-widest bg-pink-100 px-3 py-1 rounded-full">
                  It's A Date! 💕
                </span>

                <h3 className="text-2xl font-extrabold text-slate-800 mt-3 mb-2">
                  Yay! Movie Night Accepted! 💕
                </h3>

                <p className="text-slate-600 text-sm mb-6">
                  I can't wait to spend this cozy movie night with you!
                </p>

                {/* Details Summary Card */}
                <div className="bg-pink-50/80 rounded-2xl p-4 text-left border border-pink-100 space-y-3 mb-6 text-sm text-slate-700">
                  <div className="flex items-center gap-2.5">
                    <Icon name="film" className="w-4 h-4 text-pink-500 shrink-0" />
                    <span className="font-semibold">{getChosenGenreLabel()}</span>
                  </div>
                  <div className="flex items-center gap-2.5">
                    <Icon name="calendar" className="w-4 h-4 text-pink-500 shrink-0" />
                    <span>Whenever you're ready!</span>
                  </div>
                  <div className="flex items-center gap-2.5">
                    <Icon name="clock" className="w-4 h-4 text-pink-500 shrink-0" />
                    <span>Cozy evening time</span>
                  </div>
                </div>

                <button
                  onClick={() => setShowModal(false)}
                  className="w-full py-3.5 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold rounded-2xl shadow-md hover:opacity-95 active:scale-95 transition-all text-sm cursor-pointer"
                >
                  See You Soon! 🥰
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
